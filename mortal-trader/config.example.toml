# MortalBot configuration. Copy to config.toml and edit.
# Secrets are NOT set here. Export them as environment variables instead:
#   COINS_API_KEY, COINS_API_SECRET   (Coins.ph: trading only, withdrawals OFF)
#   ANTHROPIC_API_KEY                 (Claude Console; billed separately from the Claude app)

name = "mortal-001"       # each life gets its own name; a dead name stays dead
brain = "claude"          # "claude": autonomous, reads news | "rules": simple EMA strategy, no API key
symbol = "BTCPHP"         # market for the rules brain (and for backtests)
base_asset = "BTC"
quote_asset = "PHP"
interval = "1h"
history = 300
state_dir = "state"

[life]
budget_php = 5000         # its whole life: trading money AND the cost of its own thinking
death_floor_php = 0       # 0 = dies when it can no longer afford the smallest order.
                          # e.g. 2500 = "dies after losing half"
wounded_below = 0.75
critical_below = 0.40
wounded_size = 0.5
critical_size = 0.25

[agent]
model = "claude-opus-5-5" # most capable; see README for the cost of each model
effort = "medium"         # low | medium | high | xhigh | max
universe = ["BTCPHP", "ETHPHP", "SOLPHP", "XRPPHP"]   # the only coins it may ever buy
# Hard guardrails (code-enforced; Claude cannot change them)
max_positions = 3
max_position_pct = 0.5    # max share of equity in one coin
max_buys_per_day = 4
min_stop_pct = 2.0        # every buy gets a stop-loss between these
max_stop_pct = 15.0
cash_reserve_pct = 0.03
# When it thinks
min_check_minutes = 60    # Claude picks its next check between these
max_check_minutes = 1440
min_gap_minutes = 20
wake_on_move_pct = 5.0    # wake early if a coin moves this much
# Metabolism
daily_thinking_budget_php = 25
usd_php = 58              # ASSUMPTION: set to today's USD->PHP rate
charge_thinking_to_life = true
upkeep_php_per_day = 0    # e.g. your server's daily cost
# Senses
web_search_max_uses = 2   # Claude's own searches per thought; 0 = headlines only
news_max_items = 25
news_max_age_hours = 48
journal_in_context = 8
utc_offset_hours = 8      # Manila

[strategy]                # rules brain only
fast_ema = 12
slow_ema = 26
trend_ema = 100
atr_period = 14

[risk]
risk_per_trade = 0.02     # a stopped-out trade costs at most ~2% of equity (both brains)
atr_stop_mult = 2.5
trailing_stop = true
max_position_fraction = 0.95
max_consecutive_losses = 3
rest_candles = 12         # rest this many hours after the losing streak

[execution]
fee_rate = 0.003          # ASSUMPTION: set to your Coins.ph fee tier
slippage_bps = 10
poll_seconds = 30
paper_min_notional_php = 50     # Coins.ph minimum order (Nov 2026)
base_url = "https://api.pro.coins.ph"
